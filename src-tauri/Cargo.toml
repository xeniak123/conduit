[package]
name = "conduit"
version = "0.3.5"
description = "Voice-driven agent that lives in your tray"
authors = ["Conduit contributors"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/conduit-app/conduit"

[lib]
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
hound = "3.5"
enigo = "0.2"
base64 = "0.22"
anyhow = "1"
log = "0.4"
xcap = "0.9.8"
image = "0.25.6"
tauri-plugin-window-state = "^2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "charset", "http2", "stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
tauri-plugin-notification = "^2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tiny_http = "0.12"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
